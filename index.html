<!doctype html>
<html>
  <head>
    <title>Exam Time Calculator</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <h1>Calculate Exam Times</h1>
    <form id="exam-inputs">
      <div>
        <label for="exam-time">Enter exam time as hh:mm </label>
        <input required id="exam-time" type="text"/>
      </div>
      <div>
        <label for="exam-duration">Enter exam duration as hh:mm </label>
        <input required id="exam-duration" type="text"/>
      </div>
      <button type="submit">submit</button>
      <div>Ending times are written in red</div>
      <h2>Grouped by Bonus</h2>
      <ul id="bonus"></ul>
      <h2>Chronological ordering</h2>
      <ul id="chronological"></ul>
    </form>
    <script src="./index.js"></script>
  </body>
</html>
